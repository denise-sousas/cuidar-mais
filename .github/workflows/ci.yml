# Integração contínua: a cada push/PR instala as dependências e roda os testes.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
