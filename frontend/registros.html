<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <title>Alimentação e higiene | Cuidar+</title>
</head>
<body>
  <main id="pagina" hidden>
    <header class="pagina-cabecalho">
      <div><h1>Alimentação, hidratação e higiene</h1><p>Registre o que foi feito ao longo do dia.</p></div>
      <div class="acoes" id="acoes"></div>
    </header>
    <div class="filtros">
      <div class="navegador-data">
        <button class="btn-icone" id="dataAnterior" aria-label="Dia anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <input type="date" id="campoData" aria-label="Escolher data">
        <button class="btn-icone" id="dataProxima" aria-label="Próximo dia"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="btn btn-claro btn-pequeno" id="dataHoje">Hoje</button>
      </div>
      <div class="campo"><label class="rotulo" for="filtroTipo">Tipo</label><select class="controle" id="filtroTipo"></select></div>
      <strong class="data-extenso" id="dataExtenso"></strong>
    </div>
    <section class="grade-stats" id="resumo"></section>
    <section class="lista" id="lista"></section>
  </main>
  <script type="module" src="js/pages/registros.js"></script>
</body>
</html>
