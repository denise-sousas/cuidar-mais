<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <title>Histórico | Cuidar+</title>
</head>
<body>
  <main id="pagina" hidden>
    <header class="pagina-cabecalho">
      <div><h1>Histórico de cuidados</h1><p>Tudo o que foi realizado, em ordem do mais recente para o mais antigo.</p></div>
      <div class="acoes">
        <button class="btn btn-claro" id="botaoCsv"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button>
        <button class="btn btn-claro" id="botaoImprimir"><i class="fa-solid fa-print"></i> Imprimir</button>
      </div>
    </header>
    <div class="filtros">
      <div class="campo"><label class="rotulo" for="filtroDe">De</label><input class="controle" type="date" id="filtroDe"></div>
      <div class="campo"><label class="rotulo" for="filtroAte">Até</label><input class="controle" type="date" id="filtroAte"></div>
      <div class="campo"><label class="rotulo" for="filtroTipo">Tipo</label><select class="controle" id="filtroTipo"></select></div>
      <button class="btn btn-primario" id="botaoFiltrar"><i class="fa-solid fa-filter"></i> Filtrar</button>
    </div>
    <section class="lista" id="lista"></section>
    <div class="rodape-paginacao" id="paginacao"></div>
  </main>
  <script type="module" src="js/pages/historico.js"></script>
</body>
</html>
